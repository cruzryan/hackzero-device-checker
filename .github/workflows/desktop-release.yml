name: Desktop release

on:
  workflow_dispatch: {}
  push:
    tags: ["desktop-v*"]

# GitHub creates provenance using its short-lived OIDC identity. Code signing
# remains a separate, explicit platform operation; no unsigned build is called signed.
permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Test and prepare fixed collector resources
        shell: pwsh
        run: |
          go test ./...
          $env:GOOS='windows'; $env:GOARCH='amd64'; go build -trimpath -buildvcs=true -o bin/device-checker-windows-amd64.exe ./cmd/device-checker
          $env:GOOS='darwin'; $env:GOARCH='arm64'; go build -trimpath -buildvcs=true -o bin/device-checker-macos-arm64 ./cmd/device-checker
          $env:GOOS='linux'; $env:GOARCH='amd64'; go build -trimpath -buildvcs=true -o bin/device-checker-linux-amd64 ./cmd/device-checker
      - name: Build desktop MSI
        working-directory: desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          npm ci
          $version = $env:GITHUB_REF_NAME -replace '^desktop-v',''
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json
          npx tauri build --bundles msi
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          $installer = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          Copy-Item $installer.FullName ../dist/HackZero-Device-Checker-windows-amd64.msi
          Copy-Item "$($installer.FullName).sig" ../dist/HackZero-Device-Checker-windows-amd64.msi.sig
      - uses: anchore/sbom-action@v0
        with: { path: ., format: spdx-json, output-file: dist/HackZero-Device-Checker-windows-amd64.spdx.json, upload-artifact: false, upload-release-assets: false }
      - name: Hash and attest
        shell: pwsh
        run: Get-ChildItem dist -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist/SHA256SUMS-windows-amd64.txt
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: dist/HackZero-Device-Checker-windows-amd64.msi }
      - uses: actions/upload-artifact@v4
        with: { name: desktop-windows, path: dist/, if-no-files-found: error }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Prepare resources and package app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          go test ./...
          GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=true -o bin/device-checker-windows-amd64.exe ./cmd/device-checker
          GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=true -o bin/device-checker-macos-arm64 ./cmd/device-checker
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true -o bin/device-checker-linux-amd64 ./cmd/device-checker
          cd desktop; npm ci
          version="${GITHUB_REF_NAME#desktop-v}"
          VERSION="$version" node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(p));c.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(c,null,2))'
          npx tauri build --bundles app
          mkdir -p ../dist
          pkgbuild --component target/release/bundle/macos/HackZero\ Device\ Checker.app --install-location /Applications ../dist/HackZero-Device-Checker-macos-arm64.pkg
          updater="$(find target/release/bundle/macos -name '*.app.tar.gz' -type f | head -n 1)"
          cp "$updater" ../dist/HackZero-Device-Checker-macos-arm64.app.tar.gz
          cp "$updater.sig" ../dist/HackZero-Device-Checker-macos-arm64.app.tar.gz.sig
      - uses: anchore/sbom-action@v0
        with: { path: ., format: spdx-json, output-file: dist/HackZero-Device-Checker-macos-arm64.spdx.json, upload-artifact: false, upload-release-assets: false }
      - run: cd dist && shasum -a 256 * > SHA256SUMS-macos-arm64.txt
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: dist/HackZero-Device-Checker-macos-arm64.pkg }
      - uses: actions/upload-artifact@v4
        with: { name: desktop-macos, path: dist/, if-no-files-found: error }

  debian:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Prepare resources and build DEB
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          go test ./...
          GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=true -o bin/device-checker-windows-amd64.exe ./cmd/device-checker
          GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=true -o bin/device-checker-macos-arm64 ./cmd/device-checker
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true -o bin/device-checker-linux-amd64 ./cmd/device-checker
          cd desktop; npm ci
          version="${GITHUB_REF_NAME#desktop-v}"
          VERSION="$version" node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(p));c.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(c,null,2))'
          npx tauri build --bundles deb,appimage
          mkdir -p ../dist
          cp target/release/bundle/deb/*.deb ../dist/hackzero-device-checker-linux-amd64.deb
          updater="$(find target/release/bundle/appimage -name '*.AppImage' -type f | head -n 1)"
          cp "$updater" ../dist/hackzero-device-checker-linux-amd64.AppImage
          cp "$updater.sig" ../dist/hackzero-device-checker-linux-amd64.AppImage.sig
      - uses: anchore/sbom-action@v0
        with: { path: ., format: spdx-json, output-file: dist/hackzero-device-checker-linux-amd64.spdx.json, upload-artifact: false, upload-release-assets: false }
      - run: cd dist && sha256sum * > SHA256SUMS-linux-amd64.txt
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: dist/hackzero-device-checker-linux-amd64.deb }
      - uses: actions/upload-artifact@v4
        with: { name: desktop-debian, path: dist/, if-no-files-found: error }

  publish:
    needs: [windows, macos, debian]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release }
      - name: Write the signed updater manifest
        run: node scripts/write-updater-manifest.mjs release
      - run: find release -name 'SHA256SUMS-*.txt' -type f -print0 | sort -z | xargs -0 cat > release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Desktop packages are built from this public immutable tag. Verify a downloaded package with:
            `gh attestation verify PATH_TO_PACKAGE -R ${{ github.repository }}`

            Compare its SHA-256 value to `SHA256SUMS.txt`. This workflow creates provenance, not a claim of Windows code signing or Apple notarization.
          files: release/**/*
