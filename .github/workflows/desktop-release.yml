name: Desktop release

on:
  workflow_dispatch: {}
  push:
    tags: ["desktop-v*"]

# GitHub creates provenance using its short-lived OIDC identity. Code signing
# remains a separate, explicit platform operation; no unsigned build is called signed.
permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Test and prepare the bundled collector
        shell: pwsh
        run: |
          go test ./...
          # Reports carry the real release version, not "dev".
          $version = $env:GITHUB_REF_NAME -replace '^desktop-v',''
          # The collector is launched by the native tray app with captured
          # output. A GUI subsystem prevents Windows from creating a console
          # window for every local check or pairing attempt.
          $env:GOOS='windows'; $env:GOARCH='amd64'
          go build -trimpath -buildvcs=true "-ldflags=-H=windowsgui -X main.version=$version" -o bin/device-checker-windows-amd64.exe ./cmd/device-checker
      - name: Build desktop MSI
        working-directory: desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          npm ci
          npm test
          $version = $env:GITHUB_REF_NAME -replace '^desktop-v',''
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json
          npx tauri build --bundles msi
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          Copy-Item $installer.FullName ../dist/HackZero-Device-Checker-windows-amd64.msi
          Copy-Item "$($installer.FullName).sig" ../dist/HackZero-Device-Checker-windows-amd64.msi.sig
      - uses: anchore/sbom-action@v0
        with: { path: ., format: spdx-json, output-file: dist/HackZero-Device-Checker-windows-amd64.spdx.json, upload-artifact: false, upload-release-assets: false }
      - name: Hash and attest
        shell: pwsh
        run: Get-ChildItem dist -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist/SHA256SUMS-windows-amd64.txt
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: dist/HackZero-Device-Checker-windows-amd64.msi }
      - uses: actions/upload-artifact@v4
        with: { name: desktop-windows, path: dist/, if-no-files-found: error }

  # One universal app for Apple silicon and Intel Macs. The collector is built
  # for both architectures and merged with lipo; Tauri builds a universal .app.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Prepare the universal collector and package the app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          go test ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=true -ldflags="-X main.version=${version}" -o bin/device-checker-macos-arm64 ./cmd/device-checker
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -buildvcs=true -ldflags="-X main.version=${version}" -o bin/device-checker-macos-amd64 ./cmd/device-checker
          lipo -create -output bin/device-checker-macos-universal bin/device-checker-macos-arm64 bin/device-checker-macos-amd64
          chmod 0755 bin/device-checker-macos-universal
          lipo -info bin/device-checker-macos-universal
          lipo bin/device-checker-macos-universal -verify_arch arm64 x86_64
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cd desktop
          npm ci
          npm test
          VERSION="$version" node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(p));c.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(c,null,2))'
          npx tauri build --target universal-apple-darwin --bundles app
          bundle_dir="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          app="$bundle_dir/HackZero Device Checker.app"
          lipo "$app/Contents/Resources/device-checker-macos-universal" -verify_arch arm64 x86_64
          mkdir -p ../dist
          pkgbuild --component "$app" --install-location /Applications ../dist/HackZero-Device-Checker-macos-universal.pkg
          # The website links the arm64 name. Publish the same universal package
          # under it too so existing links keep working on every Mac.
          cp ../dist/HackZero-Device-Checker-macos-universal.pkg ../dist/HackZero-Device-Checker-macos-arm64.pkg
          updater="$(find "$bundle_dir" -name '*.app.tar.gz' -type f | head -n 1)"
          test -n "$updater"
          cp "$updater" ../dist/HackZero-Device-Checker-macos-universal.app.tar.gz
          cp "$updater.sig" ../dist/HackZero-Device-Checker-macos-universal.app.tar.gz.sig
      - uses: anchore/sbom-action@v0
        with: { path: ., format: spdx-json, output-file: dist/HackZero-Device-Checker-macos-universal.spdx.json, upload-artifact: false, upload-release-assets: false }
      - run: cd dist && shasum -a 256 * > SHA256SUMS-macos-universal.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/HackZero-Device-Checker-macos-universal.pkg
            dist/HackZero-Device-Checker-macos-arm64.pkg
      - uses: actions/upload-artifact@v4
        with: { name: desktop-macos, path: dist/, if-no-files-found: error }

  debian:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Prepare the bundled collector and build DEB
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          version="${GITHUB_REF_NAME#desktop-v}"
          go test ./...
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true -ldflags="-X main.version=${version}" -o bin/device-checker-linux-amd64 ./cmd/device-checker
          cd desktop
          npm ci
          npm test
          VERSION="$version" node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(p));c.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(c,null,2))'
          npx tauri build --bundles deb,appimage
          mkdir -p ../dist
          cp src-tauri/target/release/bundle/deb/*.deb ../dist/hackzero-device-checker-linux-amd64.deb
          updater="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f | head -n 1)"
          cp "$updater" ../dist/hackzero-device-checker-linux-amd64.AppImage
          cp "$updater.sig" ../dist/hackzero-device-checker-linux-amd64.AppImage.sig
      - uses: anchore/sbom-action@v0
        with: { path: ., format: spdx-json, output-file: dist/hackzero-device-checker-linux-amd64.spdx.json, upload-artifact: false, upload-release-assets: false }
      - run: cd dist && sha256sum * > SHA256SUMS-linux-amd64.txt
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: dist/hackzero-device-checker-linux-amd64.deb }
      - uses: actions/upload-artifact@v4
        with: { name: desktop-debian, path: dist/, if-no-files-found: error }

  publish:
    needs: [windows, macos, debian]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: release }
      - name: Write the signed updater manifest
        run: node scripts/write-updater-manifest.mjs release
      - run: find release -name 'SHA256SUMS-*.txt' -type f -print0 | sort -z | xargs -0 cat > release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: "true"
          body: |
            Desktop packages are built from this public immutable tag. Verify a downloaded package with:
            `gh attestation verify PATH_TO_PACKAGE -R ${{ github.repository }}`

            Compare its SHA-256 value to `SHA256SUMS.txt`. The macOS package is universal (Apple silicon and Intel); `HackZero-Device-Checker-macos-arm64.pkg` is the same package under its original name. This workflow creates provenance, not a claim of Windows code signing or Apple notarization.
          files: release/**/*
